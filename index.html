<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Anonim Sohbet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }
    #chat {
      max-width: 600px;
      margin: 40px auto;
    }
    #messages {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #444;
      padding: 10px;
      margin-bottom: 10px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-size: 16px;
    }
    button {
      background: #00ff99;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .admin {
      color: #ff5555;
      cursor: pointer;
      margin-left: 10px;
    }
  </style>
</head>
<body>

<div id="chat">
  <h2>💬 Anonim Sohbet</h2>
  <div id="messages"></div>
  <input id="msg" placeholder="Mesajını yaz..." />
  <button onclick="sendMessage()">Gönder</button>
  Güvenlik amacıyla giriş yapan kişilerin IP adresleri kayıt altına alınmaktadır
</div>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  /************ AYARLAR ************/
  const ADMIN_KEY = "Nuri_46_";
  /********************************/

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyBkdgxCEFNNhZr7lCC4pCo8ENH_E3XXV_I",
    authDomain: "itirafanonimleri.firebaseapp.com",
    projectId: "itirafanonimleri",
    storageBucket: "itirafanonimleri.firebasestorage.app",
    messagingSenderId: "494224845690",
    appId: "1:494224845690:web:231f00dadb74eeaef204c3"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  /************ ANONİM ID ************/
  let anonId = localStorage.getItem("anonId");
  if (!anonId) {
    anonId = "Anonim#" + Math.floor(_toggle = Math.random() * 9000 + 1000);
    localStorage.setItem("anonId", anonId);
  }

  /************ ADMIN KONTROL ************/
  let isAdmin = localStorage.getItem("admin") === ADMIN_KEY;
  if (!isAdmin) {
    const key = prompt("Admin girişi (boş bırak geç):");
    if (key === ADMIN_KEY) {
      localStorage.setItem("admin", ADMIN_KEY);
      location.reload();
    }
  }

  const messagesDiv = document.getElementById("messages");

  /************ MESAJLARI GÖSTER ************/
  db.collection("messages")
    .orderBy("time")
    .onSnapshot(snapshot => {
      messagesDiv.innerHTML = "";
      snapshot.forEach(doc => {
        const data = doc.data();
        const delBtn = isAdmin
          ? `<span class="admin" onclick="deleteMsg('${doc.id}')">🗑️</span>`
          : "";

        messagesDiv.innerHTML += `
          <p>
            🕵️ <b>${data.user}</b>: ${data.text}
            ${delBtn}
          </p>
        `;
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

  /************ MESAJ GÖNDER ************/
  function sendMessage() {
    const msg = document.getElementById("msg");
    if (msg.value.trim() === "") return;

    db.collection("messages").add({
      user: anonId,
      text: msg.value,
      time: Date.now()
    });

    msg.value = "";
  }

  /************ MESAJ SİL (ADMIN) ************/
  function deleteMsg(id) {
    if (confirm("Mesaj silinsin mi?")) {
      db.collection("messages").doc(id).delete();
    }
  }
</script>

</body>
</html>
