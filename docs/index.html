<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Anonim Sohbet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }
    #chat {
      max-width: 600px;
      margin: 40px auto;
    }
    #messages {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #444;
      padding: 10px;
      margin-bottom: 10px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-size: 16px;
    }
    button {
      background: #00ff99;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="chat">
  <h2>💬 Anonim Sohbet</h2>
  <div id="messages"></div>
  <input id="msg" placeholder="Mesajını yaz..." />
  <button onclick="sendMessage()">Gönder</button>
</div>

<!-- Firebase compat (GitHub Pages için en sorunsuz) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
  // 🔥 SENİN FIREBASE BİLGİLERİN
  const firebaseConfig = {
    apiKey: "AIzaSyBkdgxCEFNNhZr7lCC4pCo8ENH_E3XXV_I",
    authDomain: "itirafanonimleri.firebaseapp.com",
    projectId: "itirafanonimleri",
    storageBucket: "itirafanonimleri.firebasestorage.app",
    messagingSenderId: "494224845690",
    appId: "1:494224845690:web:231f00dadb74eeaef204c3"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const messagesDiv = document.getElementById("messages");

  // Mesajları canlı dinle
  db.collection("messages")
    .orderBy("time")
    .onSnapshot(snapshot => {
      messagesDiv.innerHTML = "";
      snapshot.forEach(doc => {
        messagesDiv.innerHTML += `<p>🕵️ ${doc.data().text}</p>`;
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

  // Mesaj gönder
  function sendMessage() {
    const msg = document.getElementById("msg");
    if (msg.value.trim() === "") return;

    db.collection("messages").add({
      text: msg.value,
      time: Date.now()
    });

    msg.value = "";
  }
</script>

</body>
</html>
